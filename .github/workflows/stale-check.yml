# 「静かに止まったこと」を検知する見張り番。
#
# 2026-09-08 追加、2026-09-09 に判定を作り直した。書き込み経路を push_files から
# Git Data API（push_via_api.sh）へ切り替えたとき、あわせて入れた。切替の代償として、
# API が通らない夜は**何も押さずに諦める**設計にしたため（壊れた本文を main に載せない
# ことを優先した）、失敗が続くと公開が静かに止まる。無人パイプラインでいちばん困るのは
# 「壊れること」ではなく「壊れたまま誰も気づかないこと」なので、ここで見張る。
#
# ■ 判定の作り方（ここが要点）
# 「最新の review が何日前か」だけで見てはいけない。**保存が0件の日は review を作らない
# のが仕様**で、実際 2026-08-24〜08-26 と 08-29 は0件だった。連休などで1週間保存が
# 無ければ、正常なのに失敗する——正常運用で鳴る通知は、すぐに読まれなくなる。
#
# そこで **「公開されていない保存が有るか」** で見る。日別台帳 `capture_index.json` に
# 保存が記録されているのに、その日の `reviews/<日付>.html` が無い状態が GRACE 日以上
# 続いていたら失敗する。保存が無い期間はいくら続いても鳴らない。
#
# 通知経路: このワークフローが失敗すると GitHub から Actions の失敗メールが届く。
# それ以外の通知先（LINE 等）は今は繋いでいない。

name: stale-check

on:
  schedule:
    # 毎日 JST 10:17 ごろ（= UTC 01:17）。夜間ランは 3〜4時台なので、
    # その日のぶんが載っていれば余裕をもって間に合っている時刻に見る。
    # ⚠️ 毎時00分を避けているのは意図的。GitHub は scheduled workflow が
    # 高負荷時（毎時ちょうどに集中する）に遅延・drop されうると明記している。
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that saved days are getting published
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os, re, sys

          # 保存があった日が公開されないまま何日続いたら異常と見なすか。
          # 夜間ランは翌日の未明なので、1日は普通に空く。2日空いたら1回は失敗している。
          GRACE_DAYS = 2
          # 台帳を入れる前の日は見ない（当時の取りこぼしが6日ある）。
          # 環境変数で差し替えられるのは、この判定を実時計に依存せず試せるようにするため。
          SINCE = os.environ.get("STALE_CHECK_SINCE", "2026-09-08")

          def day_of(name):
              m = re.fullmatch(r"(\d{4}-\d{2}-\d{2})", name)
              return m.group(1) if m else None

          try:
              with open("capture_index.json", encoding="utf-8") as fh:
                  days = json.load(fh)["days"]
          except (OSError, ValueError, KeyError, TypeError):
              print("capture_index.json が読めない。判定できないので何もしない。")
              sys.exit(0)

          saved = {d for d, e in days.items()
                   if isinstance(e, dict) and e.get("rids") and d >= SINCE}
          published = {d for d in
                       (day_of(os.path.basename(p)[:-5]) for p in glob.glob("reviews/*.html"))
                       if d}

          today = (datetime.datetime.now(datetime.timezone.utc)
                   + datetime.timedelta(hours=9)).date()
          cutoff = (today - datetime.timedelta(days=GRACE_DAYS)).isoformat()

          overdue = sorted(d for d in saved - published if d <= cutoff)

          print(f"days with saves on record (since {SINCE}): {len(saved)}")
          print(f"days published: {len(published & saved)}")
          print(f"today (JST): {today} / grace: {GRACE_DAYS} day(s)")

          if overdue:
              print()
              print(f"::error::保存があるのに公開されていない日が {len(overdue)} 日ある: "
                    + ", ".join(overdue))
              print("ランのログで WRITE_COMMIT: の行を見ること。")
              print("  - WRITE_COMMIT: none が続いている → API 経路が通っていない")
              print("  - WRITE_COMMIT: unknown が出ている → 結果不明のまま止めた（再送禁止の状態）")
              print("  - そもそも行が無い → Routine 自体が走っていない")
              print("※ 自動では作り直さない。台帳は記録であってキューではない。")
              sys.exit(1)

          print("OK")
          PY
