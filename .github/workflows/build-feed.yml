# トップ index.html を生成し、サイト全体を GitHub Pages へ deploy する。
#
# 夜間の振り返り生成そのもの（Raindrop取り込み・本文取得・reviews生成）は
# クラウド Routine 側の仕事であり、ここでは一切やらない＝二重実行にはならない。
# ここがやるのは「reviews/*.html を材料に index.html を組み立てて公開する」だけ。
#
# 経緯: 2026-08-31。index.html が約122KB に育ち、Routine のエージェントが
# push_files（＝ファイルの中身を文字列で渡すAPI）の引数として手で運びきれず、
# チャンク分割 → truncate する事故が3晩連続で発生。公開ページから
# 06-12〜08-14 の約2.5ヶ月分の日付ブロックが消えた。
#
# なぜ「commit して終わり」ではなく Pages deploy なのか:
# このリポの Pages は当初 legacy（ブランチから公開）だったが、
# GITHUB_TOKEN による commit は Pages の再ビルドを起動しない仕様のため、
# index.html を commit するだけではトップページが1日遅れる。
# そこで Pages の公開元を「GitHub Actions」に切り替え、生成と公開を
# 同じ run に紐づけた。index.html はリポに commit しない（.gitignore 済み）＝
# このワークフローは push を一切行わないので、push 競合も自己発火も起きない。

name: build-feed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は「最新の main の状態」だけがあればよいので、走行中の run は
# 途中で止めず、待機中の古い run は新しいものに置き換わってよい。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 縮み検知（下の Check reviews shrink ステップ）が sha までの全祖先を
      # 辿れるよう、このジョブだけ全履歴を取得する。
      # 既定の fetch-depth: 1 だと履歴が無く、基準集合を導出できない。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 経緯: 2026-08-31の事故は「index.html が壊れて公開される」形だったが、
      # reviews/*.html がリポから静かに消えた場合は index.html 自体は
      # 正しく組み上がってしまう（材料が減っただけなので Verify index.html の
      # 集合差チェックは空のまま通る）。ここでは「生成前の材料が過去のどこかの
      # 時点と比べて静かに縮んでいないか」だけを見る。生成物の健全性チェックは
      # 次の Verify index.html に任せる（役割を分けている）。
      #
      # 設計変更の経緯（2026-09-08・Codex 敵対的レビューの P0 を受けて）:
      # 旧実装は github.event.before と github.sha の「2点間の差分」だけを見ていた。
      # これは一度通り抜けられた変化を二度と見ない。例: 削除 push A で 49→48件になり
      # A の Actions は exit 1 になる。しかし翌晩の無害な push B では before=A であり、
      # A も B も既に48件なので diff(A, B) に削除は出ない → B は exit 0 で通り、
      # 縮小済みの状態がそのまま Pages に deploy される。CEO が実機で再現済み。
      # 同じ根から出るもう一つの穴: before のコミットが無い（force push・履歴書き換え）
      # ときに「スキップして通す」分岐も、縮小版をそのまま deploy してしまう。
      #
      # 新設計は github.event.before を一切使わない。基準点は「2点間の差分」ではなく
      # git 履歴そのもの（sha までの全祖先）にする。これにより:
      #   - event_name が push でなくても（workflow_dispatch でも）同じ判定になる
      #   - before が無くても（ブランチ初回 push・force push 後でも）同じ判定になる
      #   - 一度縮小が検知されたら、再追加されるまで恒久的に NG であり続ける
      #     （旧実装のように「次の無害な push で自動的に見えなくなる」ことがない）
      # ＝ event_name / before の有無で判定を止める分岐は存在しない。
      #
      # 既知の限界（2026-09-08・Codex 敵対的レビュー2周目。原理的に閉じられない）:
      # 基準は「sha から到達可能な履歴」なので、force push で main の履歴自体を
      # 書き換えて review の追加コミットごと切り離すと、ever_added からもその日付が
      # 消えて missing にならない＝検知できない。到達不能になった履歴の存在を、
      # 同じ到達可能履歴だけから知ることはできない。
      # 対処はコードではなくリポ設定側に置いた: main のブランチ保護で force push と
      # 削除を（管理者を含めて）禁止する。外部の状態ファイルや専用 ref を増やして
      # 「同じ情報を2箇所に持つ」ことを避けるための判断（ユーザー裁定 2026-09-08）。
      # この保護を外すときは、この限界が復活することを承知して外すこと。
      - name: Check reviews shrink
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          FLOOR_BYTES = 2000   # 実測: reviews/*.html の現行49件・最小 8,224 バイト
                                # （2026-09-07）。床はその1/4以下なので、正当な
                                # ファイルを誤って落とすことはない。
          SHRINK_RATIO = 0.7   # 現在サイズが「そのファイルが履歴上で持った最大
                                # サイズ」の70%未満に縮んだら中身の空洞化とみなす。
          ALLOW_MARKER = "[allow-review-shrink]"
          DATE_RE = re.compile(r"^reviews/(\d{4}-\d\d-\d\d)\.html$")

          def sh(*args):
              return subprocess.run(
                  ["git", *args], capture_output=True, text=True, encoding="utf-8"
              )

          def ever_added_dates(sha):
              """sha までの履歴で一度でも追加された reviews/<日付>.html の日付集合。"""
              r = sh(
                  "log", sha, "--diff-filter=A", "--name-only", "--format=",
                  "--", "reviews/",
              )
              dates = set()
              for name in r.stdout.splitlines():
                  m = DATE_RE.match(name)
                  if m:
                      dates.add(m.group(1))
              return dates

          def current_reviews(sha):
              """sha 時点の reviews/*.html を { 日付: (path, size) } で返す。
              git ls-tree -l でサイズも同時に取得し、床チェック用の cat-file
              個別呼び出し（ファイル数ぶんのプロセス起動）を避ける。
              """
              r = sh("ls-tree", "-r", "-l", sha, "--", "reviews/")
              out = {}
              line_re = re.compile(r"^\S+\s+\S+\s+\S+\s+(\S+)\t(.+)$")
              for line in r.stdout.splitlines():
                  m = line_re.match(line)
                  if not m:
                      continue
                  size_s, path = m.group(1), m.group(2)
                  dm = DATE_RE.match(path)
                  if dm and size_s != "-":
                      out[dm.group(1)] = (path, int(size_s))
              return out

          def last_delete_commit(sha, path):
              """sha までの履歴で path を最後に削除したコミット（無ければ None）。"""
              r = sh("log", sha, "--diff-filter=D", "--format=%H", "--", path)
              lines = r.stdout.splitlines()
              return lines[0] if lines else None

          def commit_message(commit):
              return sh("log", "-1", "--format=%B", commit).stdout

          def all_touch_commits(sha):
              """sha までの履歴で reviews/<日付>.html を追加(A)・変更(M)した
              コミット一覧を { path: [commit, ...] } で返す。1回の git log
              呼び出しで全ファイル分をまとめて取る（ファイルごとに git log を
              回すと49ファイル分の履歴で重くなるのを避けるため）。
              """
              r = sh(
                  "log", sha, "--format=commit:%H", "--name-status",
                  "--diff-filter=AM", "--", "reviews/",
              )
              result = {}
              current_commit = None
              for line in r.stdout.splitlines():
                  if line.startswith("commit:"):
                      current_commit = line[len("commit:"):]
                      continue
                  if not line.strip():
                      continue
                  parts = line.split("\t")
                  if len(parts) < 2:
                      continue
                  path = parts[-1]
                  if DATE_RE.match(path):
                      result.setdefault(path, []).append(current_commit)
              return result

          def max_sizes_ever(path_to_commits):
              """{ path: [commit,...] } を受け取り { path: 最大サイズ } を返す。
              全 (commit, path) ペアを1回の git cat-file --batch-check にまとめて
              渡すことで、ファイル数×コミット数ぶんプロセスを起動するコストを避ける。
              """
              pairs = []
              for path, commits in path_to_commits.items():
                  for c in commits:
                      pairs.append((path, c))
              if not pairs:
                  return {}
              batch_input = "\n".join("%s:%s" % (c, p) for p, c in pairs) + "\n"
              r = subprocess.run(
                  ["git", "cat-file", "--batch-check"],
                  input=batch_input, capture_output=True, text=True, encoding="utf-8",
              )
              max_size = {}
              lines = r.stdout.splitlines()
              if len(lines) != len(pairs):
                  raise RuntimeError(
                      "cat-file --batch-check の出力行数が不一致: %d行 (期待 %d行)"
                      % (len(lines), len(pairs))
                  )
              for (path, _commit), line in zip(pairs, lines):
                  parts = line.split()
                  if len(parts) == 2 and parts[1] == "missing":
                      continue
                  if len(parts) < 3:
                      continue
                  try:
                      size = int(parts[2])
                  except ValueError:
                      continue
                  if path not in max_size or size > max_size[path]:
                      max_size[path] = size
              return max_size

          def main():
              sha = os.environ.get("GITHUB_SHA", "")
              if not sha:
                  sha = sh("rev-parse", "HEAD").stdout.strip()

              # --- A. 日付集合（削除の検知） ---
              ever_added = ever_added_dates(sha)
              current = current_reviews(sha)
              current_dates = set(current.keys())
              missing_dates = ever_added - current_dates

              allowed_missing = set()
              for date in sorted(missing_dates):
                  path = "reviews/%s.html" % date
                  commit = last_delete_commit(sha, path)
                  if commit and ALLOW_MARKER in commit_message(commit):
                      allowed_missing.add(date)

              remaining_missing = sorted(missing_dates - allowed_missing)

              errors = []
              if remaining_missing:
                  errors.append(
                      "reviews/*.html の日付が履歴上の追加から消えている"
                      "(削除が[allow-review-shrink]で意図的として許可されていない): %s"
                      " / ever_added %d件 -> current %d件"
                      " / 最古日(ever_added) %s / 最古日(current) %s"
                      % (
                          ", ".join(remaining_missing),
                          len(ever_added),
                          len(current_dates),
                          min(ever_added) if ever_added else "(なし)",
                          min(current_dates) if current_dates else "(なし)",
                      )
                  )

              # --- B-1. 絶対値の床 ---
              tiny = []
              for date, (path, size) in sorted(current.items()):
                  if size < FLOOR_BYTES:
                      tiny.append("%s(%dバイト)" % (date, size))
              if tiny:
                  errors.append(
                      "reviews/*.html に %d バイト未満のものがある: %s"
                      % (FLOOR_BYTES, ", ".join(tiny))
                  )

              # --- B-2. 縮小率（履歴上の最大サイズ比） ---
              touch = all_touch_commits(sha)
              max_sizes = max_sizes_ever(touch)
              shrunk = []
              for date, (path, size) in sorted(current.items()):
                  max_size = max_sizes.get(path)
                  if max_size is None:
                      continue
                  if size < max_size * SHRINK_RATIO:
                      shrunk.append(
                          "%s(最大%d -> 現在%dバイト)" % (date, max_size, size)
                      )
              if shrunk:
                  errors.append(
                      "reviews/*.html が履歴上の最大サイズの%d%%未満に縮んでいる: %s"
                      % (int(SHRINK_RATIO * 100), ", ".join(shrunk))
                  )

              if errors:
                  print("NG: " + " / ".join(errors))
                  sys.exit(1)

              print(
                  "OK: reviews/*.html の削除/空洞化なし"
                  " (ever_added=%d件 current=%d件 sha=%s)"
                  % (len(ever_added), len(current_dates), sha[:7])
              )

          main()
          PY

      # カード単位の保持チェック（2026-09-22 追加）。上の「Check reviews
      # shrink」はファイル単位（存在・バイト数）でしか見ておらず、同じ
      # ファイル名のまま上書きで一部のカードだけが消えるケース（手動実行・
      # TARGET_OVERRIDE・同日再実行で reviews/<TARGET>.html が merge_review.py
      # を経由せず丸ごと新規生成で上書きされた場合等）を検知できない。
      # select_targets.py 導入後は reviews/*.html 自体が「掲載済み」の記録を
      # 兼ねるため、カードが静かに消えると該当URL/ridは二度と選ばれなくなり
      # 恒久的に失われる。ここでは直前のコミット（HEAD^）時点のカード集合が
      # 新しい版にすべて含まれているかを check_review_preserved.py で見る。
      # コミットメッセージに [allow-review-shrink] があれば許可する
      # （上の「Check reviews shrink」と同じ既存の縮小許可マーカーの流儀）。
      - name: Check review cards preserved
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify HEAD^ >/dev/null; then
            echo "HEAD^ が無い（初回コミット等）。比較対象が無いのでスキップ。"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^ HEAD -- 'reviews/*.html' || true)
          if [ -z "$changed" ]; then
            echo "no reviews/*.html changed in this push"
            exit 0
          fi
          allow_flag=()
          if git log -1 --format=%B HEAD | grep -qF '[allow-review-shrink]'; then
            allow_flag=(--allow)
          fi
          path_args=()
          while IFS= read -r p; do
            path_args+=(--path "$p")
          done <<< "$changed"
          python3 check_review_preserved.py --old-ref HEAD^ "${path_args[@]}" "${allow_flag[@]}"

      # 開示義務チェック（機械判定）。無人Routineの指示遵守だけに頼ると
      # 手順書に文言指示があっても実際に書き漏らす（2026-09-04 Reel 3件・
      # 2026-09-14 Reel 1件・2026-09-08 Threads 3件など実例あり）ため、
      # reviews/*.html と fetch_facts/*.json を突き合わせて機械的に検出する。
      # 判定ロジックの正本は check_disclosure.py 側（このymlにはマーカー文
      # を複製しない）。2026-09-15 3周目差し戻しで自由文判定から固定マーカー
      # 文（「※動画の内容は未取得」等）の有無判定に作り替え済み。
      # --since 2026-09-15 はこの仕組みを入れた日より前の既知の違反を
      # 再警告しないための足切り。--capture-index は既定の
      # capture_index.json（リポ直下）をそのまま使う。
      # この仕組みは無人Routine側の手順7の実行自体を強制しない。
      # reviews/*.html 自体が無い夜（手順7未実行）は status=no_review かつ
      # duty>0 のときに ::warning を出す。
      # 警告のみ・公開を止めない（ユーザー裁定 2026-09-15）: continue-on-error
      # により、このステップが失敗しても Rebuild index.html 以降・deploy は
      # 従来どおり進む。
      - name: Check disclosure of unfetched video/visual content
        continue-on-error: true
        run: python check_disclosure.py --all --since 2026-09-15 --github

      # _build_feed.py は標準ライブラリのみ・環境変数もネットワークも不要
      - name: Rebuild index.html
        run: python _build_feed.py

      # 壊れたものを公開しないための門番。ここで落ちれば deploy されず、
      # 直前に公開された正常なサイトがそのまま残る。
      - name: Verify index.html
        run: |
          python - <<'PY'
          import glob, io, os, re, sys

          s = io.open("index.html", encoding="utf-8").read()
          errors = []

          if not s.startswith("<!doctype html>"):
              errors.append("先頭が <!doctype html> でない")
          if not s.rstrip().endswith("</html>"):
              errors.append("末尾が </html> でない（truncate の疑い）")
          if "PLACEHOLDER" in s:
              errors.append("PLACEHOLDER を含む")
          if len(s) < 20000:
              errors.append("短すぎる（%d 文字）。truncate の疑い" % len(s))

          # 「壊れてはいないが中身が減った」出力を弾く最重要の不変条件。
          # index.html が張るリンクの数と、材料の reviews/*.html の本数は
          # 必ず一致するはず。ズレたら日付ブロックが落ちている。
          linked = set(re.findall(r'reviews/(\d{4}-\d\d-\d\d)\.html', s))
          on_disk = {os.path.basename(p)[:-5] for p in glob.glob("reviews/*.html")}
          missing = sorted(on_disk - linked)
          if missing:
              errors.append(
                  "reviews にあるのに index に載っていない日が %d 件: %s"
                  % (len(missing), ", ".join(missing[:10]))
              )
          if not on_disk:
              errors.append("reviews/*.html が1本も無い")

          if errors:
              print("NG: " + " / ".join(errors))
              sys.exit(1)
          print(
              "OK: %d 文字・reviews %d 本すべてが index に載っている（%s 〜 %s）"
              % (len(s), len(on_disk), min(on_disk), max(on_disk))
          )
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
