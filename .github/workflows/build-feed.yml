# トップ index.html を生成し、サイト全体を GitHub Pages へ deploy する。
#
# 夜間の振り返り生成そのもの（Raindrop取り込み・本文取得・reviews生成）は
# クラウド Routine 側の仕事であり、ここでは一切やらない＝二重実行にはならない。
# ここがやるのは「reviews/*.html を材料に index.html を組み立てて公開する」だけ。
#
# 経緯: 2026-08-31。index.html が約122KB に育ち、Routine のエージェントが
# push_files（＝ファイルの中身を文字列で渡すAPI）の引数として手で運びきれず、
# チャンク分割 → truncate する事故が3晩連続で発生。公開ページから
# 06-12〜08-14 の約2.5ヶ月分の日付ブロックが消えた。
#
# なぜ「commit して終わり」ではなく Pages deploy なのか:
# このリポの Pages は当初 legacy（ブランチから公開）だったが、
# GITHUB_TOKEN による commit は Pages の再ビルドを起動しない仕様のため、
# index.html を commit するだけではトップページが1日遅れる。
# そこで Pages の公開元を「GitHub Actions」に切り替え、生成と公開を
# 同じ run に紐づけた。index.html はリポに commit しない（.gitignore 済み）＝
# このワークフローは push を一切行わないので、push 競合も自己発火も起きない。

name: build-feed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は「最新の main の状態」だけがあればよいので、走行中の run は
# 途中で止めず、待機中の古い run は新しいものに置き換わってよい。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # _build_feed.py は標準ライブラリのみ・環境変数もネットワークも不要
      - name: Rebuild index.html
        run: python _build_feed.py

      # 壊れたものを公開しないための門番。ここで落ちれば deploy されず、
      # 直前に公開された正常なサイトがそのまま残る。
      - name: Verify index.html
        run: |
          python - <<'PY'
          import glob, io, os, re, sys

          s = io.open("index.html", encoding="utf-8").read()
          errors = []

          if not s.startswith("<!doctype html>"):
              errors.append("先頭が <!doctype html> でない")
          if not s.rstrip().endswith("</html>"):
              errors.append("末尾が </html> でない（truncate の疑い）")
          if "PLACEHOLDER" in s:
              errors.append("PLACEHOLDER を含む")
          if len(s) < 20000:
              errors.append("短すぎる（%d 文字）。truncate の疑い" % len(s))

          # 「壊れてはいないが中身が減った」出力を弾く最重要の不変条件。
          # index.html が張るリンクの数と、材料の reviews/*.html の本数は
          # 必ず一致するはず。ズレたら日付ブロックが落ちている。
          linked = set(re.findall(r'reviews/(\d{4}-\d\d-\d\d)\.html', s))
          on_disk = {os.path.basename(p)[:-5] for p in glob.glob("reviews/*.html")}
          missing = sorted(on_disk - linked)
          if missing:
              errors.append(
                  "reviews にあるのに index に載っていない日が %d 件: %s"
                  % (len(missing), ", ".join(missing[:10]))
              )
          if not on_disk:
              errors.append("reviews/*.html が1本も無い")

          if errors:
              print("NG: " + " / ".join(errors))
              sys.exit(1)
          print(
              "OK: %d 文字・reviews %d 本すべてが index に載っている（%s 〜 %s）"
              % (len(s), len(on_disk), min(on_disk), max(on_disk))
          )
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
