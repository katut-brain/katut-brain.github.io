# capture-pipeline の結合テスト（backfill / write-path / capture-index / run-timing）を走らせる。
#
# build-feed.yml とは別ワークフローにする。build-feed.yml は「トップ index.html を
# 生成して公開サイトへ deploy する」役割で、テストの不具合や失敗がここに波及すると
# 公開サイトの deploy が止まる事故になる。テストの成否と公開の可否は独立させ、
# ここでは Pages への書き込み権限も持たせない（permissions: contents: read のみ）。
#
# pip install は行わない。test_backfill_recovery.py は標準ライブラリの unittest
# のみを使う（backfill.py / ledger.py / fetch_content.py 本体も標準ライブラリのみで
# 動く経路をここで検査する）。

name: test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run integration tests
        run: python -m unittest -v test_backfill_recovery.py

      # push_via_api.sh の受け入れテスト。偽の gh を PATH に置いて動かすので
      # 本物の GitHub は叩かない（contents: read のままで完結する）。
      - name: Run write-path tests
        run: python -m unittest -v test_push_via_api.py

      # push_via_branch.sh の受け入れテスト。ローカルの bare リポを相手にするので
      # 本物の GitHub には書かない。
      - name: Run branch-publish tests
        run: python -m unittest -v test_push_via_branch.py

      # 「どの日が公開できていないか」を後から追える日別台帳。
      - name: Run capture-index tests
        run: python -m unittest -v test_capture_index.py

      # 動画・視覚コンテンツ未取得の開示チェッカー（check_disclosure.py）の
      # 受け入れテスト。標準ライブラリの unittest のみ。
      - name: Run disclosure-check tests
        run: python -m unittest -v test_check_disclosure.py

      # 手順ごとの所要時間計測（run_timing.py）の回帰テスト。
      - name: Run run-timing tests
        run: python -m unittest -v test_run_timing.py

      # 手順2.5（バックフィル）の実行証跡の回帰テスト。
      # ⚠️ **テストファイルを足したら必ずここにも足す。** この workflow は
      # ファイルを列挙して実行する方式なので、足し忘れると「手元では緑・CIでは
      # 一度も走らない」という状態になる（2026-09-18 Codex 6周目 P1 で実際に指摘された）。
      - name: Run backfill-evidence tests
        run: python -m unittest -v test_backfill_evidence.py
